# Pages only publishes from main, so when this test branch changes, ask the
# deploy workflow on main to run again; it copies this branch into /test/.
name: Refresh /test/ preview

on:
  push:
    branches: [apple-design-test]

permissions:
  actions: write

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

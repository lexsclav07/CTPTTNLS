name: Refresh shops & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 17 * * *" # daily, ~4:37am Sydney time
  workflow_dispatch:
    inputs:
      refresh:
        description: Re-download the shop data first
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Daily, and on manual runs. The /test/ preview skips it (refresh=false).
      - name: Refresh bottle shop list
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        continue-on-error: true # a flaky data source shouldn't stop the deploy
        timeout-minutes: 10
        run: |
          pip install --quiet openpyxl
          python3 scripts/update_shops.py
          python3 scripts/update_places.py

      # Bottle shops, pubs, bars and clubs for all of Australia, in 1-degree tiles.
      - name: Refresh Australia-wide tiles
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        continue-on-error: true
        timeout-minutes: 25
        run: python3 scripts/update_tiles.py

      # Only commits when the shop list actually changed. It's authored as the
      # repo owner (GitHub no-reply address) so the refresh counts on your
      # contribution graph; delete these two git config lines to commit as
      # github-actions[bot] instead.
      - name: Commit updated list
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: |
          git add data/
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git commit -m "Refresh bottle shop list"
          git push

      - name: Cache-bust scripts and styles
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" index.html

      # Publish the apple-design-test branch alongside the real site at /test/,
      # using today's shop list. Skipped once that branch is deleted.
      - name: Add the test branch at /test/
        run: |
          if git fetch --depth 1 origin apple-design-test 2>/dev/null; then
            mkdir -p test
            git archive FETCH_HEAD | tar -x -C test
            rm -rf test/.github test/scripts test/data/sources
            cp data/shops.json data/places.json test/data/
            if [ -d data/tiles ]; then rm -rf test/data/tiles && cp -r data/tiles test/data/tiles; fi
            sed -i "s/?v=dev/?v=test-$(git rev-parse --short FETCH_HEAD)/g" test/index.html
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bottlo Compass</title>
  <meta name="description" content="A compass that points to the nearest bottle shops.">
  <meta name="author" content="Lex Sclavos">
  <meta name="theme-color" content="#0d0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bottlo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- ?v=dev is swapped for the commit id on deploy, so phones never mix old and new files -->
  <link rel="stylesheet" href="style.css?v=dev">
  <script src="app.js?v=dev" defer></script>
</head>
<body>
  <main id="app" class="idle">
    <div id="wrap" class="dial-wrap">
      <svg id="dial" class="dial" viewBox="0 0 100 100" aria-hidden="true">
        <g id="ticks"></g>
        <text x="50" y="7.6" class="north">N</text>
      </svg>

      <svg class="arrows" viewBox="0 0 100 100" aria-hidden="true">
        <!-- next 5 closest: faint, drawn first so the main arrow sits on top -->
        <path id="a5" class="other" d="M50 15 L56 27 L51.3 25.2 L51.3 42 L48.7 42 L48.7 25.2 L44 27 Z"/>
        <path id="a4" class="other" d="M50 15 L56 27 L51.3 25.2 L51.3 42 L48.7 42 L48.7 25.2 L44 27 Z"/>
        <path id="a3" class="other" d="M50 15 L56 27 L51.3 25.2 L51.3 42 L48.7 42 L48.7 25.2 L44 27 Z"/>
        <path id="a2" class="other" d="M50 15 L56 27 L51.3 25.2 L51.3 42 L48.7 42 L48.7 25.2 L44 27 Z"/>
        <path id="a1" class="other" d="M50 15 L56 27 L51.3 25.2 L51.3 42 L48.7 42 L48.7 25.2 L44 27 Z"/>
        <!-- nearest shop -->
        <path id="a0" class="main" d="M50 9 L60.5 29 L52.7 26 L52.7 50 L47.3 50 L47.3 26 L39.5 29 Z"/>
        <circle class="hub" cx="50" cy="50" r="3.6"/>
      </svg>
    </div>

    <div class="readout" aria-live="polite">
      <div id="dist" class="dist"></div>
      <div id="name" class="name">Loading…</div>
    </div>

    <ol id="others" class="others" aria-label="Next closest"></ol>

    <a class="credit" href="https://github.com/lexsclav07/CTPTTNLS#data" aria-label="Data credits">©</a>
  </main>
</body>
</html>

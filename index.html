<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bottlo Compass</title>
  <meta name="description" content="A compass that points to the nearest bottle shops.">
  <meta name="author" content="Lex Sclavos">
  <meta name="theme-color" content="#0d0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bottlo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- ?v=dev is swapped for the commit id on deploy, so phones never mix old and new files -->
  <link rel="stylesheet" href="style.css?v=dev">
  <script src="app.js?v=dev" defer></script>
</head>
<body>
  <!-- Shop data: Liquor & Gaming NSW (CC BY 4.0) and © OpenStreetMap contributors (ODbL).
       See https://github.com/lexsclav07/CTPTTNLS#data -->
  <main id="app" class="idle">
    <div id="wrap" class="dial-wrap">
      <svg id="dial" class="dial" viewBox="0 0 100 100" aria-hidden="true">
        <g id="ticks"></g>
        <text x="50" y="7.6" class="north">N</text>
      </svg>

      <svg class="arrows" viewBox="0 0 100 100" aria-hidden="true">
        <!-- next 5 closest: faint, drawn first so the main arrow sits on top -->
        <path id="a5" class="other" d="M50 19 L55 29 L51.2 27.6 L51.2 42 L48.8 42 L48.8 27.6 L45 29 Z"/>
        <path id="a4" class="other" d="M50 19 L55 29 L51.2 27.6 L51.2 42 L48.8 42 L48.8 27.6 L45 29 Z"/>
        <path id="a3" class="other" d="M50 19 L55 29 L51.2 27.6 L51.2 42 L48.8 42 L48.8 27.6 L45 29 Z"/>
        <path id="a2" class="other" d="M50 19 L55 29 L51.2 27.6 L51.2 42 L48.8 42 L48.8 27.6 L45 29 Z"/>
        <path id="a1" class="other" d="M50 19 L55 29 L51.2 27.6 L51.2 42 L48.8 42 L48.8 27.6 L45 29 Z"/>
        <!-- their number (matching the list) and compass bearing -->
        <g id="l1" class="lbl"><text class="k" y="-2.1">1</text><text class="b" y="2.2"></text></g>
        <g id="l2" class="lbl"><text class="k" y="-2.1">2</text><text class="b" y="2.2"></text></g>
        <g id="l3" class="lbl"><text class="k" y="-2.1">3</text><text class="b" y="2.2"></text></g>
        <g id="l4" class="lbl"><text class="k" y="-2.1">4</text><text class="b" y="2.2"></text></g>
        <g id="l5" class="lbl"><text class="k" y="-2.1">5</text><text class="b" y="2.2"></text></g>
        <!-- nearest shop, with its bearing -->
        <path id="a0" class="main" d="M50 18 L59 34 L52.6 31.6 L52.6 50 L47.4 50 L47.4 31.6 L41 34 Z"/>
        <circle class="hub" cx="50" cy="50" r="3.6"/>
        <g id="l0" class="lbl main-lbl"><text class="b"></text></g>
      </svg>
    </div>

    <div class="readout" aria-live="polite">
      <div id="dist" class="dist"></div>
      <div id="name" class="name">Loading…</div>
    </div>

    <ol id="others" class="others" aria-label="Next closest"></ol>

  </main>
</body>
</html>

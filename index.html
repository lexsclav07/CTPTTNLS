<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bottlo Compass</title>
  <meta name="description" content="A compass that points to the nearest open bottle shop in Sydney, the Central Coast and Newcastle.">
  <meta name="author" content="Lex Sclavos">
  <meta name="theme-color" content="#0d0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bottlo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main id="app" class="idle">
    <div class="dial-wrap">
      <svg id="dial" class="dial" viewBox="0 0 100 100" aria-hidden="true">
        <g id="ticks"></g>
        <text x="50" y="16.5" class="north">N</text>
      </svg>
      <svg id="arrow" class="arrow" viewBox="0 0 100 100" role="img" aria-label="Direction to the shop">
        <path d="M50 14 L71 80 L50 67 L29 80 Z"/>
      </svg>
    </div>

    <div class="readout" aria-live="polite">
      <div id="dist" class="dist"></div>
      <div id="name" class="name">Loading…</div>
    </div>

    <button id="open" class="toggle" type="button" aria-pressed="true">
      <span class="dot"></span>Open now
    </button>

    <a class="credit" href="https://github.com/lexsclav07/CTPTTNLS#data" aria-label="Data credits">©</a>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bottlo Compass</title>
  <meta name="description" content="A compass that points to the nearest bottle shops.">
  <meta name="author" content="Lex Sclavos">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bottlo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- ?v=dev is swapped for the commit id on deploy, so phones never mix old and new files -->
  <link rel="stylesheet" href="style.css?v=dev">
  <script src="app.js?v=dev" defer></script>
</head>
<body>
  <!-- Shop data: Liquor & Gaming NSW (CC BY 4.0) and © OpenStreetMap contributors (ODbL).
       See https://github.com/lexsclav07/CTPTTNLS#data -->
  <!-- category icons, drawn in the style of SF Symbols -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="k-s" viewBox="0 0 24 24"><path d="M10 2.5h4v3.2l2 3V20a1.5 1.5 0 0 1-1.5 1.5h-5A1.5 1.5 0 0 1 8 20V8.7l2-3z"/><path d="M8 12h8"/></symbol>
      <symbol id="k-p" viewBox="0 0 24 24"><path d="M5 8h10.5v11.5A1.5 1.5 0 0 1 14 21H6.5A1.5 1.5 0 0 1 5 19.5z"/><path d="M15.5 10.5h2a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2"/><path d="M5 8a3 3 0 0 1 3.3-3 3.3 3.3 0 0 1 5.4 0A3 3 0 0 1 15.5 8"/></symbol>
      <symbol id="k-b" viewBox="0 0 24 24"><path d="M4 4h16l-8 9.5z"/><path d="M12 13.5V20M8 20.5h8"/></symbol>
      <symbol id="k-c" viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.4" class="fill"/><circle cx="7.3" cy="13.3" r="3.4" class="fill"/><circle cx="16.7" cy="13.3" r="3.4" class="fill"/><path d="M12 12.5 10.2 21h3.6z" class="fill"/></symbol>
  </svg>

  <main id="app" class="idle">
    <!-- iOS-style bar: back to the nearest shop (only after picking one) and units -->
    <header class="bar">
      <button id="nearest" class="back" type="button" hidden>
        <svg viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8"/></svg>Nearest
      </button>
      <div class="filter">
        <button id="filter" class="icon-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Choose places">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M7.5 9h9M9.5 12.5h5M11 16h2"/></svg>
        </button>
        <div id="menu" class="menu" role="menu" aria-label="Show these places">
          <button type="button" role="menuitemcheckbox" aria-checked="true" data-kind="s">
            <svg class="check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg>
            <span>Bottle shops</span>
            <svg class="kind" aria-hidden="true"><use href="#k-s"/></svg>
          </button>
          <button type="button" role="menuitemcheckbox" aria-checked="true" data-kind="p">
            <svg class="check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg>
            <span>Pubs</span>
            <svg class="kind" aria-hidden="true"><use href="#k-p"/></svg>
          </button>
          <button type="button" role="menuitemcheckbox" aria-checked="true" data-kind="b">
            <svg class="check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg>
            <span>Bars</span>
            <svg class="kind" aria-hidden="true"><use href="#k-b"/></svg>
          </button>
          <button type="button" role="menuitemcheckbox" aria-checked="true" data-kind="c">
            <svg class="check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg>
            <span>Clubs</span>
            <svg class="kind" aria-hidden="true"><use href="#k-c"/></svg>
          </button>
        </div>
      </div>
      <div class="units" role="group" aria-label="Distance units">
        <button type="button" data-units="metric" aria-pressed="true">km</button>
        <button type="button" data-units="imperial" aria-pressed="false">mi</button>
      </div>
    </header>

    <div class="content">
      <div id="wrap" class="dial-wrap">
        <svg id="dial" class="dial" viewBox="0 0 100 100" aria-hidden="true">
          <g id="ticks"></g>
          <text x="50" y="6" class="north">N</text>
        </svg>

        <!-- Each arrow and label is its own small layer that the GPU just rotates
             or slides, so turning the phone never redraws anything. The arrow
             boxes sit with their bottom-centre on the middle of the dial. -->
        <div class="arrows" aria-hidden="true">
          <!-- next 5 closest: faint, under the main arrow -->
          <svg id="a5" class="arrow other" viewBox="40 17 20 33"><path d="M50 19 L55 29 L51.2 27.6 L51.2 42 L48.8 42 L48.8 27.6 L45 29 Z"/></svg>
          <svg id="a4" class="arrow other" viewBox="40 17 20 33"><path d="M50 19 L55 29 L51.2 27.6 L51.2 42 L48.8 42 L48.8 27.6 L45 29 Z"/></svg>
          <svg id="a3" class="arrow other" viewBox="40 17 20 33"><path d="M50 19 L55 29 L51.2 27.6 L51.2 42 L48.8 42 L48.8 27.6 L45 29 Z"/></svg>
          <svg id="a2" class="arrow other" viewBox="40 17 20 33"><path d="M50 19 L55 29 L51.2 27.6 L51.2 42 L48.8 42 L48.8 27.6 L45 29 Z"/></svg>
          <svg id="a1" class="arrow other" viewBox="40 17 20 33"><path d="M50 19 L55 29 L51.2 27.6 L51.2 42 L48.8 42 L48.8 27.6 L45 29 Z"/></svg>
          <!-- nearest shop -->
          <!-- The colour fades green > yellow > orange > red by cross-fading four
               ready-coloured copies (opacity is free for the GPU; recolouring
               one arrow would redraw it every frame). -->
          <div id="a0" class="arrow main">
            <svg class="base" viewBox="40 17 20 33"><path d="M50 18 L59 34 L52.6 31.6 L52.6 50 L47.4 50 L47.4 31.6 L41 34 Z"/></svg>
            <svg class="tint t0" viewBox="40 17 20 33"><path d="M50 18 L59 34 L52.6 31.6 L52.6 50 L47.4 50 L47.4 31.6 L41 34 Z"/></svg>
            <svg class="tint t1" viewBox="40 17 20 33"><path d="M50 18 L59 34 L52.6 31.6 L52.6 50 L47.4 50 L47.4 31.6 L41 34 Z"/></svg>
            <svg class="tint t2" viewBox="40 17 20 33"><path d="M50 18 L59 34 L52.6 31.6 L52.6 50 L47.4 50 L47.4 31.6 L41 34 Z"/></svg>
            <svg class="tint t3" viewBox="40 17 20 33"><path d="M50 18 L59 34 L52.6 31.6 L52.6 50 L47.4 50 L47.4 31.6 L41 34 Z"/></svg>
          </div>
          <svg class="hub" viewBox="46 46 8 8"><circle cx="50" cy="50" r="3.6"/></svg>
          <!-- bearings, plus list numbers on the faint ones -->
          <div id="l1" class="lbl"><span class="k">1</span><span class="b"></span></div>
          <div id="l2" class="lbl"><span class="k">2</span><span class="b"></span></div>
          <div id="l3" class="lbl"><span class="k">3</span><span class="b"></span></div>
          <div id="l4" class="lbl"><span class="k">4</span><span class="b"></span></div>
          <div id="l5" class="lbl"><span class="k">5</span><span class="b"></span></div>
          <div id="l0" class="lbl main-lbl"><span class="b"></span><span class="k"></span></div>
        </div>
      </div>

      <!-- Portrait: these just stack under the compass. Landscape: a column on the right. -->
      <div id="side" class="side">
        <div id="readout" class="readout">
          <div id="dist" class="dist"></div>
          <div id="name" class="name status" aria-live="polite">Loading…</div>
        </div>

        <ol id="others" class="others" aria-label="Other nearby shops. Tap one to point at it."></ol>

        <!-- landscape only: everything the app is reading, live -->
        <section id="sensors" class="sensors" aria-label="Live sensor data"></section>
      </div>
    </div>

    <footer class="credit">
      Made by Lex Sclavos · <a href="https://github.com/lexsclav07" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </main>
</body>
</html>
